<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b2518" />
  <title>Offline · Gadget Malawi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07100d;
      color: #f5f8f3;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      text-align: center;
      padding: 32px 24px;
      border: 1px solid #294938;
      border-radius: 16px;
      background: #10221a;
    }
    .card img { width: 72px; height: 72px; margin-bottom: 18px; border-radius: 16px; }
    .card h1 { margin: 0 0 12px; font-size: 1.4rem; letter-spacing: -.03em; }
    .card p { margin: 0 0 22px; color: #aab9ae; line-height: 1.5; }
    .card button {
      min-height: 44px;
      padding: 0 20px;
      border: 0;
      border-radius: 10px;
      background: #2f9a65;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .card button:hover { background: #43b97c; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Gadget Malawi" />
    <h1>You're offline</h1>
    <p>Gadget Malawi works best online. Reconnect and try again — your browsing will resume right where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
